# ШАБЛОН для Streamlit Community Cloud (App settings → Secrets).
# Один и тот же GitHub-репозиторий можно развернуть как отдельное приложение
# для каждого нового клиента — просто на шаге "New app" на share.streamlit.io
# вставляешь СВОЙ набор Secrets под этого клиента. Код трогать не нужно.
#
# ВАЖНО про порядок строк: в формате TOML всё, что идёт ПОСЛЕ строки
# [gcp_service_account], считается частью этого блока. Поэтому обычные
# настройки должны стоять ДО [gcp_service_account], а не после — именно так
# они и расположены в этом файле. Не переставляй их местами.

# ---------------------------------------------------------------------------
# ПОД КЛИЕНТА — меняешь эти значения для каждого нового клиента.
# ---------------------------------------------------------------------------

