# Должен ТОЧНО совпадать с адресом задеплоенного приложения + "/", например:
# https://roka-b2b-crm.streamlit.app/
GMAIL_REDIRECT_URI = ""

# Значения ниже бери из JSON-файла ТВОЕГО сервис-аккаунта Google (DEPLOY.md, шаг 2)
# — это ОДИН и тот же сервис-аккаунт для всех клиентов. Для нового клиента
# нужно только, чтобы ОН расшарил свою таблицу на client_email ниже.
[gcp_service_account]
type = "service_account"
project_id = "ВСТАВЬ_СЮДА"
