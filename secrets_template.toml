# ---------------------------------------------------------------------------
# ОБЩЕЕ ДЛЯ ВСЕХ КЛИЕНТОВ — обычно копируется без изменений между клиентами,
# т.к. ты платишь за ИИ и держишь Google-доступ централизованно.
# ---------------------------------------------------------------------------
ANTHROPIC_API_KEY = "sk-ant-ВСТАВЬ_СЮДА"
ANTHROPIC_WORKSPACE_ID = "ВСТАВЬ_СЮДА_ЕСЛИ_НУЖЕН"

# --- Gmail (опционально — только если нужен импорт писем, см. GMAIL_SETUP.md) ---
