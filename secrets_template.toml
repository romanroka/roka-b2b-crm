# ШАБЛОН для Streamlit Community Cloud (App settings → Secrets).
# Скопируй ВСЁ содержимое этого файла, вставь в поле Secrets, замени placeholder-ы
# на свои значения и сохрани. Подробно — в DEPLOY.md, шаг 6.
#
# Значения type / project_id / private_key_id / private_key / client_email / client_id /
# auth_uri / token_uri / auth_provider_x509_cert_url / client_x509_cert_url / universe_domain
# бери из JSON-файла сервис-аккаунта, который ты скачал в Google Cloud Console (DEPLOY.md, шаг 2).
# Просто открой тот файл в любом текстовом редакторе и переноси значения поле в поле.

[gcp_service_account]
type = "service_account"
project_id = "ВСТАВЬ_СЮДА"
private_key_id = "ВСТАВЬ_СЮДА"
private_key = "-----BEGIN PRIVATE KEY-----\nВСТАВЬ_СЮДА\n-----END PRIVATE KEY-----\n"
client_email = "ВСТАВЬ_СЮДА@ВСТАВЬ_СЮДА.iam.gserviceaccount.com"
client_id = "ВСТАВЬ_СЮДА"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "ВСТАВЬ_СЮДА"
universe_domain = "googleapis.com"

# Обычные настройки — просто впиши свои значения.
ANTHROPIC_API_KEY = "sk-ant-ВСТАВЬ_СЮДА"
GOOGLE_SHEET_NAME = "ROKA B2B CRM"
SENDER_NAME = "Roman"
SENDER_ROLE = "Co-fondateur, ROKA"
SENDER_EMAIL = "roman@roka-shop.com"
RELANCE_DELAY_DAYS = "4"
